name: "release-distfiles"

on:
  push:
    tags:
      - "*-distfiles-v*"

jobs:
  release:
    runs-on: "gentoo-latest"
    permissions:
      contents: write
    steps:
      - name: "Install toolchain from binhost"
        run: emerge -G -q -un dev-lang/go net-libs/nodejs dev-libs/protobuf dev-lang/bun-bin
      - uses: "actions/checkout@v4"
        with:
          fetch-depth: 0
      - name: "Generate distfiles"
        id: "family"
        run: |
          FAMILY=${GITHUB_REF_NAME%-distfiles-v*}
          VERSION=${GITHUB_REF_NAME##*-distfiles-v}
          echo "family=${FAMILY}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir distfiles-out
          cd distfiles-out
          bash "../scripts/gen-${FAMILY}-distfiles.sh" "${VERSION}"
      - name: "Push Manifests"
        id: "manifests"
        run: |
          cp distfiles-out/* /var/cache/distfiles/
          case "${{ steps.family.outputs.family }}" in
            local-ai) DIRS=$(dirname $(find . -path ./distfiles-out -prune -o -name '*.ebuild' -print) | sort -u) ;;
            opencode) DIRS=dev-util/opencode ;;
            gitea-runner) DIRS=dev-util/gitea-runner ;;
            zot) DIRS=app-containers/zot ;;
            *) echo "unknown family ${{ steps.family.outputs.family }}"; exit 1 ;;
          esac
          for d in ${DIRS}; do ebuild --force $(ls $d/*.ebuild | head -1) manifest; done
          git config user.name "gitea-actions"
          git config user.email "gitea-actions@noreply.ipnmod.org"
          find . -name Manifest -exec git add {} +
          git diff --cached --quiet || git commit -m "Manifests for ${GITHUB_REF_NAME}"
          git push origin HEAD:master
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version_tag=${{ steps.family.outputs.family }}-v${{ steps.family.outputs.version }}" >> "$GITHUB_OUTPUT"
      - name: "Publish release"
        uses: "akkuman/gitea-release-action@v1"
        with:
          tag_name: "${{ steps.manifests.outputs.version_tag }}"
          target_commitish: "${{ steps.manifests.outputs.sha }}"
          files: "distfiles-out/*"
          sha256sum: true
