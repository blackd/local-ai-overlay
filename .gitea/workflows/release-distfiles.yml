name: "release-distfiles"

# One family per run: triggered by a <family>-distfiles-v<version> tag,
# or dispatched manually (which is also the only way to REPLACE an
# existing release — a re-pushed tag over one is skipped, not
# double-published). The heavy lifting lives in scripts/: families.sh
# (family -> manifest dirs), release-family.sh (exists-check, generate,
# publish), manifest-and-push.sh (manifest, commit, retry-push).

on:
  push:
    tags:
      - "*-distfiles-v*"
  workflow_dispatch:
    inputs:
      family:
        description: "Distfiles family (see scripts/families.sh)"
        required: true
      version:
        description: "Version to release"
        required: true
      rerelease:
        description: "Regenerate and REPLACE an existing release"
        type: boolean
        default: false

jobs:
  release:
    runs-on: "gentoo-latest"
    permissions:
      contents: "write"
    steps:
      - uses: "actions/checkout@v4"
        with:
          fetch-depth: 0
          ref: "master"
      - name: "Resolve family and version"
        id: "fam"
        run: |
          if [ -n "${{ inputs.family }}" ]; then
            FAMILY="${{ inputs.family }}" VERSION="${{ inputs.version }}"
          else
            FAMILY=${GITHUB_REF_NAME%-distfiles-v*}
            VERSION=${GITHUB_REF_NAME##*-distfiles-v}
          fi
          echo "family=${FAMILY}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: "Release ${{ steps.fam.outputs.family }}"
        run: >-
          bash scripts/release-family.sh
          "${{ steps.fam.outputs.family }}"
          "${{ steps.fam.outputs.version }}"
          "${{ inputs.rerelease || 'false' }}"
      - name: "Manifests"
        env:
          RELEASE_TAG: "${{ steps.fam.outputs.family }}-v${{ steps.fam.outputs.version }}"
        run: |
          source scripts/families.sh
          bash scripts/manifest-and-push.sh $(family_dirs "${{ steps.fam.outputs.family }}")
