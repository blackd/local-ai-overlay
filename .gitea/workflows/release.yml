name: release-distfiles

on:
  push:
    tags:
      - 'distfiles-v*'

jobs:
  release:
    runs-on: gentoo-latest
    permissions:
      contents: write
    steps:
      - name: Unpack repos snapshot
        run: |
          VARIANT=$(cat /etc/gentoo-runner-variant 2>/dev/null || echo westmere)
          API=https://git.ipnmod.org/v2/mirinimi/gentoo-runner-repos
          DIGEST=$(curl -sf -u "mirinimi:${{ secrets.REGISTRY_TOKEN }}" -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' ${API}/manifests/${VARIANT}-latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["layers"][0]["digest"])')
          curl -sfL -u "mirinimi:${{ secrets.REGISTRY_TOKEN }}" ${API}/blobs/${DIGEST} | tar -xzf - -C /
      - name: Install toolchain from binhost
        run: emerge -G -q dev-lang/go net-libs/nodejs dev-libs/protobuf
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate distfiles
        run: |
          VERSION=${GITHUB_REF_NAME#distfiles-v}
          bash scripts/gen-distfiles.sh "${VERSION}"
      - name: Push Manifests
        id: manifests
        run: |
          cp distfiles-out/*.tar.xz /var/cache/distfiles/
          for d in $(dirname $(find . -name '*.ebuild') | sort -u); do ebuild --force $(ls $d/*.ebuild | head -1) manifest; done
          git config user.name "gitea-actions"
          git config user.email "gitea-actions@noreply.ipnmod.org"
          find . -name Manifest -exec git add {} +
          git diff --cached --quiet || git commit -m "Manifests for ${GITHUB_REF_NAME}"
          git push origin HEAD:master
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version_tag=v${GITHUB_REF_NAME#distfiles-v}" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: akkuman/gitea-release-action@v1
        with:
          tag_name: ${{ steps.manifests.outputs.version_tag }}
          target_commitish: ${{ steps.manifests.outputs.sha }}
          files: distfiles-out/*.tar.xz
          sha256sum: true
