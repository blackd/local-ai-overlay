name: "check-updates"

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: "gentoo-latest"
    permissions:
      issues: write
    steps:
      - name: "Install jq from binhost"
        run: emerge -G -q -un app-misc/jq
      - uses: "actions/checkout@v4"
        with:
          ref: "master"
      - name: "Check upstream releases and GURU"
        run: bash scripts/check-updates.sh
        env:
          GITHUB_TOKEN: "${{ github.token }}"
